<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        h2{
            border: 1px dotted black;
        }
    </style>
    <script>
        function FirstFunction(){
            alert("Hello World");
        }

        function clicky(){
            alert("Thanks for clicking me!");
        }

        function hovery(){
            alert("Thanks for rollingover me!");
        }

    
    </script>
</head>
<body onload="FirstFunction()";>
    <h1>JavaScript Basics</h1>
    <p onclick="clicky()">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <h2 onmouseover="hovery()">Hover text</h2>
</body>
</html>
